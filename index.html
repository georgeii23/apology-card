<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apology Card for Ruby Ji</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('https://images.pexels.com/photos/60597/dahlia-red-blossom-bloom-60597.jpeg') no-repeat center center/cover;
            text-align: center;
            font-family: 'Arial', sans-serif;
            color: white;
            position: relative;
        }
        .card {
            background: rgba(255, 182, 193, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
            max-width: 400px;
            animation: fadeIn 2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .shayari {
            font-style: italic;
            margin: 15px 0;
            font-size: 18px;
        }
        .button {
            background: #ff69b4;
            border: none;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .button:hover {
            background: #ff1493;
        }
        .message {
            display: none;
            font-weight: bold;
            margin-top: 15px;
        }
        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .heart {
            position: absolute;
            color: pink;
            font-size: 20px;
            animation: float 3s infinite ease-in-out;
        }
        @keyframes float {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>
    <audio id="bg-music" loop>
        <source src="https://www.bensound.com/royalty-free-music/track/sandstorm-intriguing-cinematic" type="audio/mpeg">
    </audio>
    <div class="hearts"></div>
    <div class="card">
        <h2>Dear Ruby Ji🐵,</h2>
        <p class="shayari">"Dosti ki gehraiyon me jo pyar hai,<br>
        Uska ehsaas har lamha bekaraar hai.<br>
        Galti ho gayi jo dil dukhaya tera,<br>
        Maafi maangta hoon, dosti hamari be-misaal hai."</p>
        <button class="button" onclick="showMessage()">Click for My Apology</button>
        <p class="message" id="message">I'm truly sorry🙏 for hurt I caused. You mean the important to me, and I value our friendship immensely. Please forgive me! 💖</p>
        <button class="button" onclick="playMusic()">Play Music</button>
    </div>
    <script>
        function showMessage() {
            document.getElementById('message').style.display = 'block';
        }
        function playMusic() {
            const audio = document.getElementById('bg-music');
            audio.play();
        }
        function createHearts() {
            const heartsContainer = document.querySelector('.hearts');
            for (let i = 0; i < 20; i++) {
                let heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = Math.random() * 100 + 'vh';
                heart.style.animationDuration = (Math.random() * 2 + 1) + 's';
                heartsContainer.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }
        }
        setInterval(createHearts, 1000);
    </script>
</body>
</html>
